name: "Diverge Preview Environment"
description: "Validate .diverge.yaml, detect changed microservices, deploy delta PreviewGroups, and tear down previews"
author: "Diverge"
branding:
  icon: "git-branch"
  color: "purple"

inputs:
  action:
    description: "Action to perform: validate, diff, deploy, verify, replay, or teardown"
    required: false
    default: "deploy"
  version:
    description: "Diverge CLI version to install (e.g. latest, v0.3.2, or installed to skip download)"
    required: false
    default: "latest"
  config:
    description: "Path to .diverge.yaml configuration file"
    required: false
    default: ".diverge.yaml"
  kubeconfig:
    description: "Raw or base64-encoded kubeconfig for the target Kubernetes cluster"
    required: false
    default: ""
  namespace:
    description: "Default Kubernetes namespace for preview resources"
    required: false
    default: "default"
  preview-name:
    description: "Explicit PreviewGroup name override (default: pr-<number> or branch slug)"
    required: false
    default: ""
  base-ref:
    description: "Git base reference for diverge diff"
    required: false
    default: ""
  branch:
    description: "Source branch name override"
    required: false
    default: ""
  pr-number:
    description: "Pull request number override"
    required: false
    default: ""
  services:
    description: "Explicit comma- or newline-separated service specs (overrides diverge diff)"
    required: false
    default: ""
  image-registry:
    description: "Container registry prefix for changed service images (e.g. ghcr.io/acme)"
    required: false
    default: ""
  image-tag:
    description: "Image tag for changed services (defaults to preview-name)"
    required: false
    default: ""
  header-key:
    description: "HTTP routing header key"
    required: false
    default: "x-diverge-env"
  header-value:
    description: "HTTP routing header value (defaults to preview-name)"
    required: false
    default: ""
  ttl:
    description: "Preview environment time-to-live duration (e.g. 4h, 24h)"
    required: false
    default: "4h"
  base-url:
    description: "Optional staging/gateway base URL to construct a shareable ?_diverge_env= preview URL"
    required: false
    default: ""
  wait:
    description: "Wait for PreviewGroup Ready condition before completing"
    required: false
    default: "false"
  wait-timeout:
    description: "Timeout when waiting for PreviewGroup readiness"
    required: false
    default: "180s"
  verify:
    description: "Run diverge verify after deploy (true/false)"
    required: false
    default: "false"
  verify-path:
    description: "HTTP path to probe during verify"
    required: false
    default: "/"
  verify-compare-baseline:
    description: "Compare preview response against baseline during verify (true/false)"
    required: false
    default: "false"
  verify-max-latency:
    description: "Maximum allowed HTTP latency during verify (e.g. 2s)"
    required: false
    default: "5s"
  replay:
    description: "Run diverge replay after deploy (true/false)"
    required: false
    default: "false"
  replay-from:
    description: "Path to HAR (.har) or JSONL (.jsonl) trace file for diverge replay"
    required: false
    default: ""
  replay-max-latency:
    description: "Maximum allowed preview latency per replayed request (e.g. 500ms, 2s)"
    required: false
    default: ""
  replay-compare-values:
    description: "Compare exact scalar values during replay instead of structural types (true/false)"
    required: false
    default: "false"
  replay-fail-on-extra-fields:
    description: "Fail replay when preview adds new fields not present in baseline (true/false)"
    required: false
    default: "false"
  replay-ignore-fields:
    description: "Comma-separated field paths or Protobuf field numbers to ignore during replay"
    required: false
    default: ""
  replay-filter-hosts:
    description: "Comma-separated host patterns to include from HAR/JSONL traces during replay"
    required: false
    default: ""
  replay-strip-auth:
    description: "Strip recorded Authorization/X-Api-Key headers and auth query tokens from replayed traces (true/false)"
    required: false
    default: "false"
  replay-redact-query:
    description: "Comma-separated query parameter names to redact with [REDACTED] before replaying"
    required: false
    default: ""
  replay-redact-body-fields:
    description: "Comma-separated JSON request body field names or dot-paths to redact before replaying"
    required: false
    default: ""
  replay-proto-descriptor:
    description: "Optional compiled Protobuf FileDescriptorSet (.pb/.desc) for named-field Protobuf diffs"
    required: false
    default: ""
  replay-proto-message:
    description: "Fully-qualified Protobuf response message name when using replay-proto-descriptor"
    required: false
    default: ""
  auto-fix:
    description: "Automatically create or update a self-healing AgentTask when verify or replay fails (true/false)"
    required: false
    default: "false"
  dry-run:
    description: "Render PreviewGroup manifest without applying to Kubernetes"
    required: false
    default: "false"

outputs:
  preview-name:
    description: "Resolved PreviewGroup name (e.g. pr-42)"
    value: ${{ steps.preview.outputs.preview-name }}
  changed-services:
    description: "JSON array of changed service names"
    value: ${{ steps.preview.outputs.changed-services }}
  changed-count:
    description: "Number of changed services detected"
    value: ${{ steps.preview.outputs.changed-count }}
  skipped:
    description: "Whether deployment was skipped because no services changed"
    value: ${{ steps.preview.outputs.skipped }}
  routing-header:
    description: "HTTP routing header string (e.g. x-diverge-env: pr-42)"
    value: ${{ steps.preview.outputs.routing-header }}
  routing-header-json:
    description: "JSON object of the routing header for Playwright/Cypress"
    value: ${{ steps.preview.outputs.routing-header-json }}
  preview-url:
    description: "Shareable zero-extension preview URL with ?_diverge_env= query parameter"
    value: ${{ steps.preview.outputs.preview-url }}

runs:
  using: "composite"
  steps:
    - name: Install Diverge CLI
      shell: bash
      env:
        DIVERGE_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$DIVERGE_VERSION" == "installed" ]]; then
          echo "Using pre-installed diverge CLI: $(command -v diverge)"
          exit 0
        fi
        VERSION="$DIVERGE_VERSION" sh "${{ github.action_path }}/install.sh"

    - name: Run Diverge Preview Action
      id: preview
      shell: bash
      env:
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_KUBECONFIG: ${{ inputs.kubeconfig }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_PREVIEW_NAME: ${{ inputs.preview-name }}
        INPUT_BASE_REF: ${{ inputs.base-ref || (github.base_ref && format('origin/{0}', github.base_ref)) || 'origin/main' }}
        INPUT_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number || github.event.number }}
        INPUT_SERVICES: ${{ inputs.services }}
        INPUT_IMAGE_REGISTRY: ${{ inputs.image-registry }}
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        INPUT_HEADER_KEY: ${{ inputs.header-key }}
        INPUT_HEADER_VALUE: ${{ inputs.header-value }}
        INPUT_TTL: ${{ inputs.ttl }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INPUT_VERIFY: ${{ inputs.verify }}
        INPUT_VERIFY_PATH: ${{ inputs.verify-path }}
        INPUT_VERIFY_COMPARE_BASELINE: ${{ inputs.verify-compare-baseline }}
        INPUT_VERIFY_MAX_LATENCY: ${{ inputs.verify-max-latency }}
        INPUT_REPLAY: ${{ inputs.replay }}
        INPUT_REPLAY_FROM: ${{ inputs.replay-from }}
        INPUT_REPLAY_MAX_LATENCY: ${{ inputs.replay-max-latency }}
        INPUT_REPLAY_COMPARE_VALUES: ${{ inputs.replay-compare-values }}
        INPUT_REPLAY_FAIL_ON_EXTRA_FIELDS: ${{ inputs.replay-fail-on-extra-fields }}
        INPUT_REPLAY_IGNORE_FIELDS: ${{ inputs.replay-ignore-fields }}
        INPUT_REPLAY_FILTER_HOSTS: ${{ inputs.replay-filter-hosts }}
        INPUT_REPLAY_STRIP_AUTH: ${{ inputs.replay-strip-auth }}
        INPUT_REPLAY_REDACT_QUERY: ${{ inputs.replay-redact-query }}
        INPUT_REPLAY_REDACT_BODY_FIELDS: ${{ inputs.replay-redact-body-fields }}
        INPUT_REPLAY_PROTO_DESCRIPTOR: ${{ inputs.replay-proto-descriptor }}
        INPUT_REPLAY_PROTO_MESSAGE: ${{ inputs.replay-proto-message }}
        INPUT_AUTO_FIX: ${{ inputs.auto-fix }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: "${{ github.action_path }}/scripts/ci-preview.sh"
