name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go build ./...
          go build -tags=no_knative,no_schema,no_temporal,no_kafka -o /tmp/diverge-controller-slim ./cmd/controller/
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          # E2E tests in /test/ are filtered out because they require a real cluster
          # and are run in a separate workflow (e2e.yaml) using the 'e2e' build tag.
          PACKAGES=$(go list ./... | grep -v '/gen/' | grep -v '/test/' | tr '\n' ' ')
          go test $PACKAGES -race -coverprofile=coverage.out
          (cd pkg/sdk/temporal && go test -race ./...)
      - name: Coverage Check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 60% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"
      - name: Integration Tests (envtest)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.21
          go_path="$(go env GOPATH)"
          for attempt in 1 2 3 4 5; do
            if KUBEBUILDER_ASSETS="$("$go_path/bin/setup-envtest" use 1.32.x --bin-dir /tmp/envtest -p path)"; then
              break
            fi
            echo "setup-envtest download attempt ${attempt} failed; retrying..." >&2
            sleep $((attempt * 3))
          done
          test -n "${KUBEBUILDER_ASSETS:-}"
          export KUBEBUILDER_ASSETS
          go test ./internal/controller/... ./internal/server/... -tags=integration -v -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        run: go tool golangci-lint run

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Lint Helm Chart
        run: |
          ./scripts/test-helm.sh
          helm lint charts/diverge
          helm template diverge charts/diverge > /dev/null
          helm template diverge charts/diverge \
            --set metrics.serviceMonitor.enabled=true \
            --set server.enabled=true \
            --set server.metrics.serviceMonitor.enabled=true > /dev/null
          helm template diverge charts/diverge \
            --set server.enabled=true \
            --set server.auth.oidc.enabled=true \
            --set server.auth.oidc.issuerUrl=https://issuer.example.com \
            --set server.auth.oidc.clientId=diverge-web \
            --set server.auth.oidc.clientSecretSecretRef.name=oidc-secret \
            --set server.auth.session.secretRef.name=session-secret \
            --set sandbox.macaroonSecretRef.name=macaroon-root-key > /dev/null
          helm template diverge charts/diverge \
            --set rbac.namespaceScoped=true \
            --set "rbac.managedNamespaces={dev,staging}" \
            --set server.enabled=true \
            --set server.rbac.clusterWidePodAccess=false \
            --set "server.rbac.targetNamespaces={dev,staging}" \
            --set proxy.enabled=true \
            --set database.provider=schema \
            --set database.host=postgres.default.svc \
            --set database.passwordSecretName=db-secret > /dev/null
          helm template diverge charts/diverge \
            --set grafana.dashboards.enabled=true \
            --set prometheus.alerts.enabled=true > /dev/null
          python3 -m json.tool charts/diverge/dashboards/diverge-overview.json > /dev/null

  file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install editorconfig-checker
        run: go install github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@v3.8.0
      - name: Run editorconfig-checker
        run: editorconfig-checker

  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.52.1'
          github_token: ${{ github.token }}
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@$(grep google.golang.org/protobuf go.mod | awk '{print $2}')
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@$(grep connectrpc.com/connect go.mod | awk '{print $2}')
          git clone --depth=1 --branch codegen/v0.13.1 https://github.com/protocgen/proto2mcp.git /tmp/proto2mcp
          cd /tmp/proto2mcp/codegen && go build -o $(go env GOPATH)/bin/protoc-gen-proto2mcp ./cmd/protoc-gen-proto2mcp
      - name: Proto lint and breaking check
        run: |
          buf lint api/proto
          buf breaking api/proto --against 'https://github.com/divergedev/diverge.git#branch=main'
      - name: Clean and regenerate protos
        run: |
          rm -rf api/gen/diverge/
          buf generate
      - name: Check for stale generated files
        run: |
          DIFF=$(git diff -I 'protoc-gen-go v' --stat api/gen/diverge/ 2>/dev/null || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- api/gen/diverge/ 2>/dev/null || true)
          if [[ -n "$DIFF" || -n "$UNTRACKED" ]]; then
            echo "❌ Generated protobuf/connect files are stale!"
            echo ""
            [[ -n "$DIFF" ]] && echo "Modified:" && echo "$DIFF"
            [[ -n "$UNTRACKED" ]] && echo "Untracked:" && echo "$UNTRACKED"
            echo ""
            echo "Run 'make proto' and commit the updated api/gen/ directory."
            exit 1
          fi
          echo "✅ Generated files are up-to-date"
      - name: Check CRD and deepcopy staleness
        run: |
          make generate manifests
          DIFF=$(git diff -I 'protoc-gen-go v' -I 'controller-gen' --stat api/ config/crd/ config/rbac/ config/webhook/ 2>/dev/null || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- api/ config/crd/ config/rbac/ config/webhook/ 2>/dev/null || true)
          if [[ -n "$DIFF" || -n "$UNTRACKED" ]]; then
            echo "❌ CRD manifests or deepcopy are stale!"
            [[ -n "$DIFF" ]] && echo "Modified:" && echo "$DIFF"
            [[ -n "$UNTRACKED" ]] && echo "Untracked:" && echo "$UNTRACKED"
            echo "Run 'make generate manifests' and commit."
            exit 1
          fi
          echo "✅ CRD manifests and deepcopy are up-to-date"

  test-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check PBT coverage for CRD types
        run: bash scripts/check-pbt-coverage.sh
      - name: Check test file co-location
        run: bash scripts/check-test-coverage.sh

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t diverge:local -f Dockerfile .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: 'diverge:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.52.1'
          github_token: ${{ github.token }}
      - name: Generate TypeScript proto clients
        run: buf generate --template buf.gen.web.yaml api/proto
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  sdk-node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: pkg/sdk/node/package-lock.json
      - run: npm ci
        working-directory: pkg/sdk/node
      - run: npm run build
        working-directory: pkg/sdk/node
      - run: npx vitest run
        working-directory: pkg/sdk/node

  sdk-python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pkg/sdk/python/uv.lock
      - run: uv sync --python ${{ matrix.python-version }} --all-extras
        working-directory: pkg/sdk/python
      - run: uv run --python ${{ matrix.python-version }} pytest tests/ -v
        working-directory: pkg/sdk/python

  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
