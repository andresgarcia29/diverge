replicaCount: 1

image:
  repository: ghcr.io/divergedev/diverge
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

routingProvider: gateway  # gateway, istio, composite, noop, or comma-separated e.g. "gateway,istio"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
  cloudMonitoringDashboard:
    enabled: false

observability:
  otel:
    enabled: false
    endpoint: ""
    serviceName: ""
  autoInstrumentation:
    enabled: false
    endpoint: "otel-collector.observability:4317"
    go:
      enabled: false  # eBPF needs CAP_SYS_PTRACE, disabled by default

grafana:
  dashboards:
    enabled: true

prometheus:
  alerts:
    enabled: false  # requires Prometheus Operator CRDs (monitoring.coreos.com)

webhook:
  port: 9443
  secretName: diverge-webhook-token
  # -- Comma-separated list of numeric GitLab user IDs authorized to execute /diverge MR slash commands.
  # Upgrade warning: Upgrading with this empty default disables GitLab MR slash-command execution
  # (fail-closed) and returns HTTP 200 without posting feedback. Configure authorized numeric
  # GitLab user IDs before upgrading if you rely on GitLab MR slash commands.
  gitlabAllowedUsers: ""
  validatingWebhook:
    enabled: false
    failurePolicy: Fail
    caBundle: ""
  admissionPolicy:
    enabled: false

# -- Namespace for Environments created by webhooks and slash commands. Empty means "default".
defaultNamespace: ""

# MR/PR notifier: posts preview comments and reads .diverge.yaml from the source branch.
notifier:
  provider: "noop"  # gitlab | github | noop
  # -- API base URL, e.g. https://gitlab.com or https://gitlab.example.com. Required for gitlab.
  baseUrl: ""
  # -- Secret holding the API token (GitLab: `api` scope). Sets DIVERGE_NOTIFIER_TOKEN.
  tokenSecretRef:
    name: ""
    key: token

# -- Extra controller arguments, appended after the chart's own flags.
extraArgs: []
# -- Extra controller environment variables (list of EnvVar).
extraEnv: []

deploy:
  provider: "noop"  # argocd | direct | noop
  manifestSourceType: "configmap"  # configmap | url (for direct deployer)

# Database configuration for preview schema isolation
database:
  # Database provider: noop (disabled), shared (shared DB), schema (per-preview schemas)
  provider: "noop"
  # PostgreSQL connection settings (required when provider is 'schema')
  host: ""
  port: 5432
  user: "postgres"
  name: "diverge_preview"
  # SSL mode for PostgreSQL. Use 'require' for production, 'disable' for local development.
  sslMode: "require"
  # Reference to existing K8s Secret containing the database password
  passwordSecretName: ""
  passwordSecretKey: "password"
  # SetupJob configures the K8s Job that executes the schema initialization SQL
  setupJob:
    image: "postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee"

# Async routing, Redis/Valkey key-prefix, and S3/GCS/MinIO object storage isolation
async:
  provider: "noop"  # noop | kafka | temporal | redis | valkey | s3 | gcs | minio | webhook
  redis:
    addr: ""
    db: 0
    username: ""
    passwordSecretName: ""
    passwordSecretKey: "password"
  storage:
    endpoint: ""
    bucket: ""
    region: ""
    secretName: ""
    accessKeyKey: "access-key"
    secretKeyKey: "secret-key"
    gcsTokenSecretName: ""
    gcsTokenSecretKey: "token"

serviceAccount:
  create: true
  name: diverge-controller
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

proxy:
  enabled: false
  replicaCount: 1
  image:
    repository: ""  # defaults to image.repository
    tag: ""  # defaults to image.tag, then .Chart.AppVersion
  port: 8090
  previewDomain: ""
  upstream: ""
  headerKey: "x-preview-env"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 8090

activatorProxy:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/divergedev/activator-proxy
    tag: ""  # defaults to .Chart.AppVersion
  port: 8080
  activatorUrl: ""
  targetNamespace: "default"
  targetSelector: ""
  targetPort: 8080
  targetRevision: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

server:
  enabled: false
  replicaCount: 1
  image:
    repository: ""  # defaults to image.repository
    tag: ""  # defaults to image.tag, then .Chart.AppVersion
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8443
  auth:
    tokenCacheTTL: 5s
    audiences:
      - diverge-server
    maxStreams: 250
    maxStreamsPerUser: 20
    # -- Secure flag on session cookies: 'auto' (when server terminates TLS, or OIDC redirect URL is https), 'true', or 'false'.
    secureCookies: "auto"
    # -- OIDC SSO configuration. When enabled, users can log in via an
    # OpenID Connect provider (Okta, Google, Auth0, Keycloak, etc.)
    oidc:
      enabled: false
      # -- OIDC provider issuer URL (e.g. https://accounts.google.com)
      issuerUrl: ""
      # -- OIDC client ID registered with your provider
      clientId: ""
      # -- Kubernetes Secret containing the OIDC client secret
      clientSecretSecretRef:
        name: ""
        key: "clientSecret"
      # -- Public callback URL (must match your OIDC provider config)
      # e.g. https://diverge.example.com/auth/callback
      redirectUrl: ""
      # -- Display name for the SSO button (e.g. "Google", "Okta")
      providerName: "SSO"
      # -- OIDC scopes to request
      scopes: "openid,profile,email,groups"
      # -- JWT claim used for username
      usernameClaim: "preferred_username"
      # -- JWT claim used for group membership
      groupsClaim: "groups"
      # -- Restrict access to users in these groups (comma-separated, empty = all)
      allowedGroups: ""
    # -- Session JWT configuration (used for OIDC sessions)
    session:
      # -- Session cookie max age in seconds
      maxAge: 86400
      # -- Kubernetes Secret containing HMAC signing key (base64).
      # If not set, a random key is generated on startup (sessions
      # won't survive restarts).
      secretRef:
        name: ""
        key: "session-secret"
  cors:
    # WARNING: When AllowCredentials is true, you MUST set specific origins.
    # Using "*" with credentials is a CSRF vulnerability.
    allowedOrigins: "*"
    allowCredentials: false  # set to true only with explicit origins
    maxAge: 86400
  dashboard:
    # -- Enable the embedded web dashboard at /
    enabled: true
  rbac:
    # -- If true, grants cluster-wide pods/log access via ClusterRole.
    # If false, restricts pods/log access to targetNamespaces only.
    # When false and targetNamespaces is empty, NO pod access is granted.
    clusterWidePodAccess: true
    # -- List of namespaces where the server can access pods/log.
    # Only used when clusterWidePodAccess is false.
    # NOTE: Target namespaces must exist before helm install/upgrade.
    # The chart does NOT create these namespaces.
    targetNamespaces: []
  metrics:
    serviceMonitor:
      enabled: false
      interval: 30s

# cert-manager integration for webhook TLS
certManager:
  # -- Enable cert-manager Certificate/Issuer for webhook TLS.
  # When false, you must create the TLS secret manually.
  enabled: false
  # -- Issuer kind: Issuer (namespace-scoped) or ClusterIssuer
  issuerKind: Issuer
  # -- Issuer name. Empty = create a self-signed Issuer automatically.
  issuerName: ""

rbac:
  # -- Scope the controller's permissions to specific namespaces.
  # When false (default), a ClusterRole is used for cluster-wide access.
  namespaceScoped: false
  # -- List of namespaces to manage when namespaceScoped is true.
  managedNamespaces: []

# Agent Sandbox configuration for autonomous development tasks
sandbox:
  # -- Enable sandbox execution support in the chart
  enabled: true
  # -- Default sandbox provider: agent-sandbox | noop
  provider: "agent-sandbox"
  # -- Default warm pool name (if configured)
  poolRef: "default-pool"
  # -- Kubernetes Secret containing the shared HMAC root key (DIVERGE_MACAROON_ROOT_KEY)
  # used by diverge-controller to mint AgentTask capability tokens and by diverge-server
  # to verify them.
  macaroonSecretRef:
    name: ""
    key: "root-key"
  # -- Security network policies
  networkPolicy:
    enabled: true
    blockCloudMetadata: true
    blockKubernetesAPI: true
