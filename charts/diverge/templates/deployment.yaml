apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diverge.fullname" . }}-controller-manager
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        {{- include "diverge.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "diverge.fullname" .) }}
      securityContext:
        runAsNonRoot: true
      containers:
      - args:
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --routing-provider={{ .Values.routingProvider }}
        - --leader-elect
        - --webhook-port={{ .Values.webhook.port }}
        {{- if and .Values.webhook .Values.webhook.gitlabAllowedUsers }}
        - --gitlab-allowed-users={{ .Values.webhook.gitlabAllowedUsers }}
        {{- end }}
        {{- if .Values.database }}
        - --database-provider={{ .Values.database.provider | default "noop" }}
        {{- end }}
        {{- if .Values.async }}
        - --async-provider={{ .Values.async.provider | default "noop" }}
        {{- if and .Values.async.storage .Values.async.storage.endpoint }}
        - --storage-endpoint={{ .Values.async.storage.endpoint }}
        {{- end }}
        {{- if and .Values.async.storage .Values.async.storage.bucket }}
        - --storage-bucket={{ .Values.async.storage.bucket }}
        {{- end }}
        {{- end }}
        {{- if .Values.deploy }}
        - --deploy-provider={{ .Values.deploy.provider | default "noop" }}
        {{- if eq (.Values.deploy.provider | default "noop") "direct" }}
        - --manifest-source-type={{ .Values.deploy.manifestSourceType | default "configmap" }}
        {{- end }}
        {{- end }}
        {{- if .Values.defaultNamespace }}
        - --default-namespace={{ .Values.defaultNamespace }}
        {{- end }}
        {{- if .Values.notifierProvider }}
        - --notifier-provider={{ .Values.notifierProvider }}
        {{- else if .Values.notifier }}
        - --notifier-provider={{ .Values.notifier.provider | default "noop" }}
        {{- end }}
        {{- if .Values.sandbox }}
        - --enable-agent-sandbox={{ .Values.sandbox.enabled }}
        - --sandbox-provider={{ .Values.sandbox.provider | default "agent-sandbox" }}
        {{- end }}
        {{- range .Values.extraArgs }}
        - {{ . | quote }}
        {{- end }}
        command:

        - /diverge-controller
        image: {{ include "diverge.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        name: diverge-controller
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        {{- if and .Values.database (ne .Values.database.provider "noop") }}
        - name: DIVERGE_DB_HOST
          value: {{ .Values.database.host | quote }}
        - name: DIVERGE_DB_PORT
          value: {{ .Values.database.port | default 5432 | quote }}
        - name: DIVERGE_DB_USER
          value: {{ .Values.database.user | quote }}
        - name: DIVERGE_DB_NAME
          value: {{ .Values.database.name | quote }}
        - name: DIVERGE_DB_SSLMODE
          value: {{ .Values.database.sslMode | default "disable" | quote }}
        {{- if .Values.database.setupJob }}
        - name: DIVERGE_SETUP_JOB_IMAGE
          value: {{ .Values.database.setupJob.image | quote }}
        {{- end }}
        {{- if .Values.database.passwordSecretName }}
        - name: DIVERGE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.passwordSecretName }}
              key: {{ .Values.database.passwordSecretKey | default "password" }}
        {{- end }}
        {{- end }}
        {{- if and .Values.async .Values.async.redis }}
        {{- if .Values.async.redis.addr }}
        - name: DIVERGE_REDIS_ADDR
          value: {{ .Values.async.redis.addr | quote }}
        {{- end }}
        {{- if .Values.async.redis.db }}
        - name: DIVERGE_REDIS_DB
          value: {{ .Values.async.redis.db | quote }}
        {{- end }}
        {{- if .Values.async.redis.username }}
        - name: DIVERGE_REDIS_USERNAME
          value: {{ .Values.async.redis.username | quote }}
        {{- end }}
        {{- if .Values.async.redis.passwordSecretName }}
        - name: DIVERGE_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.async.redis.passwordSecretName }}
              key: {{ .Values.async.redis.passwordSecretKey | default "password" }}
        {{- end }}
        {{- end }}
        {{- if and .Values.async .Values.async.storage }}
        {{- if .Values.async.storage.endpoint }}
        - name: DIVERGE_STORAGE_ENDPOINT
          value: {{ .Values.async.storage.endpoint | quote }}
        {{- end }}
        {{- if .Values.async.storage.bucket }}
        - name: DIVERGE_STORAGE_BUCKET
          value: {{ .Values.async.storage.bucket | quote }}
        {{- end }}
        {{- if .Values.async.storage.region }}
        - name: DIVERGE_STORAGE_REGION
          value: {{ .Values.async.storage.region | quote }}
        {{- end }}
        {{- if .Values.async.storage.secretName }}
        - name: DIVERGE_STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.async.storage.secretName }}
              key: {{ .Values.async.storage.accessKeyKey | default "access-key" }}
        - name: DIVERGE_STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.async.storage.secretName }}
              key: {{ .Values.async.storage.secretKeyKey | default "secret-key" }}
        {{- end }}
        {{- if .Values.async.storage.gcsTokenSecretName }}
        - name: DIVERGE_GCS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.async.storage.gcsTokenSecretName }}
              key: {{ .Values.async.storage.gcsTokenSecretKey | default "token" }}
        {{- end }}
        {{- end }}
        {{- if .Values.observability.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.observability.otel.endpoint | quote }}
        {{- if .Values.observability.otel.serviceName }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.observability.otel.serviceName | quote }}
        {{- end }}
        {{- end }}
        {{- if and .Values.sandbox .Values.sandbox.macaroonSecretRef .Values.sandbox.macaroonSecretRef.name }}
        - name: DIVERGE_MACAROON_ROOT_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.sandbox.macaroonSecretRef.name }}
              key: {{ .Values.sandbox.macaroonSecretRef.key | default "root-key" }}
        {{- end }}
        {{- if and .Values.webhook (ne .Values.webhook.enabled false) .Values.webhook.secretName }}
        - name: DIVERGE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.webhook.secretName }}
              key: token
              optional: true
        {{- end }}
        {{- if and .Values.webhook .Values.webhook.gitlabAllowedUsers }}
        - name: DIVERGE_GITLAB_ALLOWED_USERS
          value: {{ .Values.webhook.gitlabAllowedUsers | quote }}
        {{- end }}
        {{- with .Values.notifier }}
        {{- if .baseUrl }}
        - name: DIVERGE_BASE_URL
          value: {{ .baseUrl | quote }}
        {{- end }}
        {{- if and .tokenSecretRef .tokenSecretRef.name }}
        - name: DIVERGE_NOTIFIER_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .tokenSecretRef.name }}
              key: {{ .tokenSecretRef.key | default "token" }}
        {{- end }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: webhook-tls
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-tls
        secret:
          secretName: {{ .Values.webhook.tlsSecretName | default "diverge-webhook-tls" }}
          optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
